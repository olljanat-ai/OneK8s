# Reusable plan+apply workflow used by deploy-foundations and deploy-tenants.
# Authentication uses long-lived credentials stored as GitHub secrets
# (Azure client secret, AWS access keys, GCP service account key).
#
# The job binds to the GitHub environment "<cloud>-<environment>"
# (e.g. azure-prod), so approvals/wait timers are configured per cloud and
# per environment under Settings -> Environments.
name: terraform-deploy (reusable)

on:
  workflow_call:
    inputs:
      stack:
        description: "Stack directory, e.g. foundations/azure"
        required: true
        type: string
      cloud:
        description: "azure | aws | gcp"
        required: true
        type: string
      environment:
        description: "dev | staging | prod"
        required: true
        type: string
      config:
        description: >-
          File stem for backend/<config>.hcl and envs/<config>.tfvars.
          Defaults to the environment name; the unified tenants stack passes
          "<cloud>-<environment>".
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.stack }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.cloud }}-${{ inputs.environment }}
    concurrency:
      # One writer per stack+config; never cancel a running apply.
      group: ${{ inputs.stack }}-${{ inputs.config || inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_CONFIG: ${{ inputs.config || inputs.environment }}
      # Azure credentials are needed on every cloud: the unified tenants
      # stack keeps its state in Azure Storage.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to GCP
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # The AWS and GCP tenant stacks shell out for cluster tokens
      # (aws eks get-token / gke auth); both CLIs are preinstalled on
      # ubuntu-latest, but the GKE auth plugin is not.
      - name: Install GKE auth plugin
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: terraform init
        working-directory: ${{ inputs.stack }}
        run: terraform init -backend-config=backend/${TF_CONFIG}.hcl

      - name: terraform plan
        working-directory: ${{ inputs.stack }}
        run: terraform plan -var-file=envs/${TF_CONFIG}.tfvars -input=false -out=tfplan

      - name: terraform apply
        working-directory: ${{ inputs.stack }}
        run: terraform apply -input=false tfplan
