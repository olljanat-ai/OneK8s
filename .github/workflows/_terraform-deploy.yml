# Reusable plan+apply workflow used by deploy-foundations and deploy-tenants.
# Authentication uses long-lived credentials stored as GitHub secrets
# (Azure client secret, AWS access keys, GCP service account key, an OCI
# signing key, and — for the private cloud — a Vault token and an NKP
# management-cluster ServiceAccount token).
#
# The job binds to the GitHub environment "<cloud>-<environment>"
# (e.g. azure-prod), so approvals/wait timers are configured per cloud and
# per environment under Settings -> Environments. The tenants stack spans all
# clouds in one run and passes cloud "all" plus its own gh_environment
# ("tenants-<environment>").
name: terraform-deploy (reusable)

on:
  workflow_call:
    inputs:
      stack:
        description: "Stack directory, e.g. foundations/azure"
        required: true
        type: string
      cloud:
        description: "azure | aws | gcp | oci | nutanix | all"
        required: true
        type: string
      environment:
        description: "prototype | dev | staging | prod — selects backend/<env>.hcl and envs/<env>.tfvars"
        required: true
        type: string
      gh_environment:
        description: >-
          GitHub environment to bind the job to. Defaults to
          "<cloud>-<environment>".
        required: false
        type: string
        default: ""
      runner:
        description: >-
          Runner the job goes to. The private cloud is by definition not
          reachable from GitHub's hosted runners — its NKP management cluster,
          its workload cluster and its Vault all sit on an internal network —
          so any run that touches nutanix has to go to a self-hosted runner
          inside it. Everything else stays on ubuntu-latest.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.stack }} (${{ inputs.environment }})
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.gh_environment || format('{0}-{1}', inputs.cloud, inputs.environment) }}
    concurrency:
      # One writer per stack+environment; never cancel a running apply.
      group: ${{ inputs.stack }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_ENV: ${{ inputs.environment }}
      # Azure credentials are needed on every cloud: every stack — foundations
      # included — keeps its state in the Azure Storage state home.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # The oci provider and the OCI CLI read their credentials straight from
      # the environment; both are ignored on the other clouds.
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CLI_USER: ${{ vars.OCI_USER_OCID }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      # The private cloud's two credentials. The vault provider reads
      # VAULT_TOKEN straight from the environment (its address comes from the
      # foundation's own configuration/state, not from here), and the NKP
      # management-cluster token is what the stacks use to read the workload
      # cluster's kubeconfig. Both are ignored on the other clouds.
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      TF_VAR_nkp_management_token: ${{ secrets.NKP_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        if: inputs.cloud == 'aws' || inputs.cloud == 'all'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to GCP
        if: inputs.cloud == 'gcp' || inputs.cloud == 'all'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # The AWS, GCP and OCI tenant stacks shell out for cluster tokens
      # (aws eks get-token / gke auth / oci ce cluster generate-token); the
      # AWS and gcloud CLIs are preinstalled on ubuntu-latest, the GKE auth
      # plugin and the OCI CLI are not.
      - name: Install GKE auth plugin
        if: inputs.cloud == 'gcp' || inputs.cloud == 'all'
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Install OCI CLI
        if: inputs.cloud == 'oci' || inputs.cloud == 'all'
        run: |
          curl -sSfL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: terraform init
        working-directory: ${{ inputs.stack }}
        run: terraform init -backend-config=backend/${TF_ENV}.hcl

      - name: terraform plan
        working-directory: ${{ inputs.stack }}
        run: terraform plan -var-file=envs/${TF_ENV}.tfvars -input=false -out=tfplan

      - name: terraform apply
        working-directory: ${{ inputs.stack }}
        run: terraform apply -input=false tfplan
