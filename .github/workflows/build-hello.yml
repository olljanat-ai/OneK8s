name: Build Hello App

# Builds the example .NET application's container image and publishes it to
# GHCR. This is the only pipeline in the repository that produces an artefact
# rather than applying Terraform: from here Argo CD takes over, syncing
# apps/hello/chart to every cloud (see docs/hello-app.md).
#
# Pull requests build but do not push, so a change to the app is compiled and
# containerised before it is merged without publishing anything.
on:
  push:
    branches: [main]
    paths:
      - "apps/hello/**"
      - ".github/workflows/build-hello.yml"
  pull_request:
    paths:
      - "apps/hello/**"
      - ".github/workflows/build-hello.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-hello-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which matters here: the
      # repository is "OneK8s" and GHCR only accepts lowercase paths.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/hello
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      # linux/amd64 only: every foundation's node pool is x86 today
      # (VM.Standard.E2.1, t3.small, e2-medium, the AKS default).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/hello
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Hello image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Built only — pull requests do not push._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
