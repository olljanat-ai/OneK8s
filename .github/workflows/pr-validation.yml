name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  # Plans run against the prototype environment: backend/prototype.hcl +
  # envs/prototype.tfvars in every stack.
  TF_ENVIRONMENT: "prototype"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - foundations/azure
          - foundations/aws
          - foundations/gcp
          - foundations/oci
          - tenants
          - gitops
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform validate
        working-directory: ${{ matrix.stack }}
        run: |
          terraform init -backend=false
          terraform validate

  # The GitOps half of the repository is Helm, not Terraform: gitops/argocd is
  # what Argo CD's root Application renders on the hub, apps/*/chart is what it
  # renders on every cluster. Both are rendered here for the same reason the
  # stacks are validated — a template error would otherwise only surface as a
  # failed sync after the merge.
  charts:
    name: helm (lint + render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # Rendered twice, because the second render produces objects the first
      # one does not: without a database in the foundation's outputs the
      # db-hello ApplicationSet is deliberately absent, so only the SQL run
      # exercises that template.
      - name: Argo CD configuration
        run: |
          helm lint gitops/argocd
          helm template platform-gitops gitops/argocd > /dev/null
          helm template platform-gitops gitops/argocd \
            --set sql.server=sql-onek8s-prototype-ab12.database.windows.net \
            --set sql.database=appdb > /dev/null

      - name: Applications, as rendered on each cloud
        run: |
          helm lint apps/hello/chart --set ingress.host=azure-hello.onek8s.lol
          for cloud in azure aws gcp oci; do
            helm template "hello-$cloud" apps/hello/chart \
              --set cloud="$cloud" \
              --set ingress.host="$cloud-hello.onek8s.lol" > /dev/null
          done

      # db-hello is Azure-only, so there is one render rather than four — and
      # both halves of sql are required, which is what these --set values are
      # standing in for.
      - name: The Azure SQL application
        run: |
          db_hello=(
            --set ingress.host=azure-db-hello.onek8s.lol
            --set sql.server=sql-onek8s-prototype-ab12.database.windows.net
            --set sql.database=appdb
          )
          helm lint apps/db-hello/chart "${db_hello[@]}"
          helm template db-hello-azure apps/db-hello/chart "${db_hello[@]}" > /dev/null

  # db-hello's schema is code-first: the EF Core model in apps/db-hello/src is
  # the only description of the tables, and the Bootstrap SQL workflow applies
  # the migrations generated from it. That only holds if the two agree, so a
  # model change without `dotnet ef migrations add` fails here rather than in a
  # deployment that quietly does nothing.
  migrations:
    name: ef migrations (db-hello)
    runs-on: ubuntu-latest
    env:
      # Must match the EF Core packages in apps/db-hello/src/DbHello.csproj.
      EF_VERSION: "10.0.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # No database is contacted: the check builds the model and compares it
      # with the snapshot the migrations carry.
      - name: The model and the migrations must agree
        run: |
          dotnet tool install dotnet-ef --version "$EF_VERSION" --tool-path .ef-tools
          ./.ef-tools/dotnet-ef migrations has-pending-model-changes \
            --project apps/db-hello/src --no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --format compact

  security:
    name: checkov (static security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          # Findings are reported but do not fail the PR; tighten by removing
          # soft_fail once the baseline is clean.
          soft_fail: true

  # Plans run against the prototype environment of each cloud. They require
  # the cloud credential secrets referenced below to exist, so they are gated
  # behind a repository variable to keep PR checks green on a fresh
  # fork/clone: set ENABLE_CLOUD_PLANS=true once cloud credentials are
  # configured.
  plan:
    name: plan ${{ matrix.stack }} (${{ matrix.cloud }})
    if: vars.ENABLE_CLOUD_PLANS == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "cloud" only selects which credentials and CLIs the job sets up; the
        # backend/*.hcl + envs/*.tfvars stem is the environment name. The single
        # tenants stack covers every cloud in one plan, so it needs them all,
        # and so does gitops — it talks to the hub and to every spoke.
        include:
          - stack: foundations/azure
            cloud: azure
          - stack: foundations/aws
            cloud: aws
          - stack: foundations/gcp
            cloud: gcp
          - stack: foundations/oci
            cloud: oci
          - stack: tenants
            cloud: all
          - stack: gitops
            cloud: all
    env:
      # azurerm/azapi providers (and the azurerm state backend) pick these up
      # directly. Azure credentials are needed on every cloud: every stack —
      # foundations included — keeps its state in the Azure Storage state home.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # The oci provider and the OCI CLI read their credentials straight from
      # the environment; both are ignored on the other clouds.
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CLI_USER: ${{ vars.OCI_USER_OCID }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        if: matrix.cloud == 'aws' || matrix.cloud == 'all'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to GCP
        if: matrix.cloud == 'gcp' || matrix.cloud == 'all'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # Planning an already-deployed OCI stack mints a cluster token with the
      # OCI CLI (the helm and kubernetes providers exec it).
      - name: Install OCI CLI
        if: matrix.cloud == 'oci' || matrix.cloud == 'all'
        run: |
          curl -sSfL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: terraform plan
        working-directory: ${{ matrix.stack }}
        run: |
          terraform init -backend-config=backend/${{ env.TF_ENVIRONMENT }}.hcl
          terraform plan -var-file=envs/${{ env.TF_ENVIRONMENT }}.tfvars -lock=false -input=false -no-color
