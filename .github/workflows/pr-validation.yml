name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - foundations/azure
          - foundations/aws
          - foundations/gcp
          - foundations/oci
          - tenants
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform validate
        working-directory: ${{ matrix.stack }}
        run: |
          terraform init -backend=false
          terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --format compact

  security:
    name: checkov (static security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          # Findings are reported but do not fail the PR; tighten by removing
          # soft_fail once the baseline is clean.
          soft_fail: true

  # Plans run against the prototype environment of each cloud. They require
  # the cloud credential secrets referenced below to exist, so they are gated
  # behind a repository variable to keep PR checks green on a fresh
  # fork/clone: set ENABLE_CLOUD_PLANS=true once cloud credentials are
  # configured.
  plan:
    name: plan ${{ matrix.stack }} (${{ matrix.config }})
    if: vars.ENABLE_CLOUD_PLANS == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "config" is the backend/*.hcl + envs/*.tfvars file stem. The single
        # tenants stack targets a cloud purely through that file.
        include:
          - stack: foundations/azure
            cloud: azure
            config: prototype
          - stack: foundations/aws
            cloud: aws
            config: prototype
          - stack: foundations/gcp
            cloud: gcp
            config: prototype
          - stack: foundations/oci
            cloud: oci
            config: prototype
          - stack: tenants
            cloud: azure
            config: azure-prototype
          - stack: tenants
            cloud: aws
            config: aws-prototype
          - stack: tenants
            cloud: gcp
            config: gcp-prototype
          - stack: tenants
            cloud: oci
            config: oci-prototype
    env:
      # azurerm/azapi providers (and the azurerm state backend) pick these up
      # directly. Azure credentials are needed on every cloud: every stack —
      # foundations included — keeps its state in the Azure Storage state home.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # The oci provider and the OCI CLI read their credentials straight from
      # the environment; both are ignored on the other clouds.
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CLI_USER: ${{ vars.OCI_USER_OCID }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to GCP
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # Planning an already-deployed OCI stack mints a cluster token with the
      # OCI CLI (the helm and kubernetes providers exec it).
      - name: Install OCI CLI
        if: matrix.cloud == 'oci'
        run: |
          curl -sSfL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: terraform plan
        working-directory: ${{ matrix.stack }}
        run: |
          terraform init -backend-config=backend/${{ matrix.config }}.hcl
          terraform plan -var-file=envs/${{ matrix.config }}.tfvars -lock=false -input=false -no-color
