name: Publish Grafana Cloud Credentials

# The Grafana Cloud access-policy token and the instance IDs that go with it,
# published to every cloud's secret backend as one object:
#
#   this workflow --> Key Vault --> Secrets Manager (AWS) / Secret Manager (GCP) / Vault (OCI)
#
# It is the certificate distribution's road with a different payload, and
# deliberately the same one: Key Vault is the source of truth, the other three
# hold copies, and each cluster reads the copy in the backend it already reads
# its tenant secrets from. Every target is resolved out of that cloud's
# foundation state, so a cloud with no foundation in the environment is skipped
# rather than failing the run, and there are no per-cloud coordinates to keep
# in sync.
#
# The credentials never reach Terraform: the foundations only say which Key
# Vault secret to read and which Kubernetes Secret it lands in, so nothing here
# ends up in a state file. Alloy polls that Secret, so a token published by
# this workflow is picked up by the collectors within the hour without an apply
# or a restart.
#
# The object is one JSON value, because one access-policy token authenticates
# every signal and only the instance ID differs between them:
#
#   { "token": "glc_…", "metrics-username": "1234567",
#     "logs-username": "7654321", "traces-username": "1122334" }
#
# It uses the reserved "platform-" prefix, which no tenant may claim — tenant
# identities are scoped to their own "<tenant>-" prefix. The platform
# identities that read it are narrower still: each cluster's monitoring
# identity is granted this one secret and nothing else, so it cannot read the
# wildcard certificate's private key that shares the prefix.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment whose foundations (and Key Vault) to publish for"
        required: true
        default: "prototype"
        type: choice
        options: [prototype, dev, staging, prod]
      metrics_username:
        description: "Hosted Prometheus instance ID (blank = the GRAFANA_CLOUD_METRICS_USERNAME repository variable)"
        required: false
        type: string
      logs_username:
        description: "Hosted Loki instance ID (blank = the GRAFANA_CLOUD_LOGS_USERNAME repository variable)"
        required: false
        type: string
      traces_username:
        description: "Hosted Tempo instance ID (blank = the GRAFANA_CLOUD_TRACES_USERNAME repository variable; optional — leave empty when traces are not enabled)"
        required: false
        type: string
      secret_name:
        description: "Name of the credentials object (alphanumerics and dashes only); must match grafana_cloud_secret_name in the foundations"
        required: false
        default: "platform-grafana-cloud"
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: ${{ inputs.secret_name || 'platform-grafana-cloud' }} -> Azure, AWS, GCP, OCI (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # The same GitHub environment the Azure foundation and the certificate
    # workflow bind to: this run's privileged input is the Key Vault it writes
    # the token into, so the vault's credentials stay configured in one place.
    # The AWS/GCP/OCI writes use the repository-level credentials — the same
    # trade the certificate distribution makes, see docs/architecture.md,
    # "Known trade-offs".
    environment: azure-${{ inputs.environment }}
    concurrency:
      # One publication at a time per environment; never cancel a run
      # mid-flight, it would leave the four backends holding different tokens.
      group: publish-grafana-credentials-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_ENV: ${{ inputs.environment }}
      # Reads every foundation's state out of the Azure Storage state home and
      # authenticates the az CLI against Key Vault.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # The OCI CLI reads its credentials straight from the environment.
      OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CLI_USER: ${{ vars.OCI_USER_OCID }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      SECRET_NAME: ${{ inputs.secret_name || 'platform-grafana-cloud' }}
      # The token is the only confidential half. The instance IDs are not, so
      # they are ordinary inputs, falling back to repository variables when the
      # run is started without them.
      GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
      METRICS_USERNAME: ${{ inputs.metrics_username || vars.GRAFANA_CLOUD_METRICS_USERNAME }}
      LOGS_USERNAME: ${{ inputs.logs_username || vars.GRAFANA_CLOUD_LOGS_USERNAME }}
      TRACES_USERNAME: ${{ inputs.traces_username || vars.GRAFANA_CLOUD_TRACES_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          missing=""
          [ -n "$ARM_CLIENT_ID" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$ARM_TENANT_ID" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$ARM_SUBSCRIPTION_ID" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -n "$ARM_CLIENT_SECRET" ] || missing="$missing AZURE_CLIENT_SECRET"
          [ -n "$GRAFANA_CLOUD_TOKEN" ] || missing="$missing GRAFANA_CLOUD_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables/secrets:$missing" >&2
            echo "See docs/monitoring.md, 'Publishing the credentials'." >&2
            exit 1
          fi
          # Metrics and logs are what every enabled foundation configures, so
          # an object without their instance IDs would leave the collectors
          # authenticating as nobody. Traces are optional by design.
          missing=""
          [ -n "$METRICS_USERNAME" ] || missing="$missing metrics_username"
          [ -n "$LOGS_USERNAME" ] || missing="$missing logs_username"
          if [ -n "$missing" ]; then
            echo "::error::Missing instance IDs:$missing — pass them as inputs, or set the matching GRAFANA_CLOUD_*_USERNAME repository variables." >&2
            exit 1
          fi
          case "$SECRET_NAME" in
            *[!a-zA-Z0-9-]*)
              echo "::error::secret_name may only contain alphanumerics and dashes: '$SECRET_NAME'" >&2
              exit 1
              ;;
          esac

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Every coordinate this job needs comes out of a foundation state, so a
      # cloud that has no foundation in this environment simply has no target
      # and is skipped — and, because that is decided here, its credentials are
      # never configured either. Azure is the exception: it holds the source of
      # truth, so without it there is nowhere to publish to.
      - name: Resolve the vault and the targets
        id: targets
        run: |
          set -euo pipefail
          foundation_ready() {
            [ -f "foundations/$1/backend/${TF_ENV}.hcl" ] &&
              terraform -chdir="foundations/$1" init -input=false \
                -backend-config="backend/${TF_ENV}.hcl" >/dev/null 2>&1
          }
          read_output() {
            terraform -chdir="foundations/$1" output -raw "$2" 2>/dev/null || true
          }

          if ! foundation_ready azure; then
            echo "::error::cannot read the foundations/azure state for ${TF_ENV}" >&2
            exit 1
          fi
          uri="$(read_output azure key_vault_uri)"
          if [ -z "$uri" ]; then
            echo "::error::foundations/azure has no key_vault_uri output for ${TF_ENV}; deploy the foundation first" >&2
            exit 1
          fi
          # https://<name>.vault.azure.net/ -> <name>
          vault="${uri#https://}"
          vault="${vault%%.*}"
          echo "vault=$vault" >> "$GITHUB_OUTPUT"
          echo "Source of truth: Key Vault $vault ($uri)"

          aws_region=""; aws_kms=""
          if foundation_ready aws; then
            aws_region="$(read_output aws region)"
            aws_kms="$(read_output aws secrets_kms_key_arn)"
          fi
          if [ -z "$aws_region" ] || [ -z "$aws_kms" ]; then
            echo "::warning::foundations/aws is not deployed for ${TF_ENV}; skipping AWS."
            aws_region=""; aws_kms=""
          else
            echo "AWS: Secrets Manager in $aws_region"
          fi
          {
            echo "aws_region=$aws_region"
            echo "aws_kms=$aws_kms"
            # Secrets Manager names are hierarchical ("<env>/<tenant>/<name>"),
            # and the platform is the reserved "platform" tenant, so the
            # credentials keep the same place in that layout as the wildcard
            # certificate. foundations/aws derives the identical name.
            echo "aws_secret=${TF_ENV}/platform/${SECRET_NAME#platform-}"
          } >> "$GITHUB_OUTPUT"

          gcp_project=""
          if foundation_ready gcp; then
            gcp_project="$(read_output gcp project_id)"
          fi
          if [ -z "$gcp_project" ]; then
            echo "::warning::foundations/gcp is not deployed for ${TF_ENV}; skipping GCP."
          else
            echo "GCP: Secret Manager in project $gcp_project"
          fi
          echo "gcp_project=$gcp_project" >> "$GITHUB_OUTPUT"

          oci_vault=""; oci_key=""; oci_compartment=""; oci_region=""
          if foundation_ready oci; then
            oci_vault="$(read_output oci vault_id)"
            oci_key="$(read_output oci vault_key_id)"
            oci_compartment="$(read_output oci compartment_id)"
            oci_region="$(read_output oci region)"
          fi
          if [ -z "$oci_vault" ] || [ -z "$oci_key" ] || [ -z "$oci_compartment" ]; then
            echo "::warning::foundations/oci is not deployed for ${TF_ENV}; skipping OCI."
            oci_vault=""; oci_key=""; oci_compartment=""; oci_region=""
          else
            echo "OCI: Vault $oci_vault in $oci_region"
          fi
          {
            echo "oci_vault=$oci_vault"
            echo "oci_key=$oci_key"
            echo "oci_compartment=$oci_compartment"
            echo "oci_region=$oci_region"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.targets.outputs.aws_region != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.targets.outputs.aws_region }}

      - name: Authenticate to GCP
        if: steps.targets.outputs.gcp_project != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up gcloud
        if: steps.targets.outputs.gcp_project != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Install OCI CLI
        if: steps.targets.outputs.oci_vault != ''
        run: |
          curl -sSfL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Log in to Azure
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" \
            --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      # The payload holds a token, so it stays in a file under RUNNER_TEMP —
      # outside the workspace, and out of step outputs and the log. jq builds
      # it from environment variables rather than from a template, so nothing
      # in it needs quoting by hand.
      - name: Build the credentials object
        id: payload
        run: |
          set -euo pipefail
          jq -n \
            --arg token "$GRAFANA_CLOUD_TOKEN" \
            --arg metrics "$METRICS_USERNAME" \
            --arg logs "$LOGS_USERNAME" \
            --arg traces "$TRACES_USERNAME" \
            '{token: $token, "metrics-username": $metrics, "logs-username": $logs}
             + (if $traces == "" then {} else {"traces-username": $traces} end)' \
            > "$RUNNER_TEMP/grafana-cloud.json"

          # The token's own shape is the only thing that can be checked without
          # calling Grafana Cloud: an access-policy token starts with "glc_".
          # A user's API key does not, and would authenticate nothing.
          case "$GRAFANA_CLOUD_TOKEN" in
            glc_*) ;;
            *) echo "::warning::the token does not look like an access-policy token (expected a 'glc_' prefix); publishing it anyway." ;;
          esac

          if [ -n "$TRACES_USERNAME" ]; then
            echo "traces=included" >> "$GITHUB_OUTPUT"
          else
            echo "traces=omitted" >> "$GITHUB_OUTPUT"
          fi
          jq -r 'keys | join(", ")' < "$RUNNER_TEMP/grafana-cloud.json" | sed 's/^/Fields: /'

      # Key Vault first and on its own: it is the source of truth, and a run
      # that cannot write it has nothing to distribute.
      - name: Write to Key Vault
        env:
          VAULT: ${{ steps.targets.outputs.vault }}
        run: |
          set -euo pipefail
          az keyvault secret set \
            --vault-name "$VAULT" --name "$SECRET_NAME" \
            --file "$RUNNER_TEMP/grafana-cloud.json" --encoding utf-8 \
            --only-show-errors --output none
          echo "Wrote $SECRET_NAME to $VAULT."

      # The three pushes are independent: one cloud refusing the write must not
      # keep the other two on a stale token, so each is allowed to fail on its
      # own and the job is failed at the end by the outcome check.
      - name: Push to AWS Secrets Manager
        id: aws
        if: steps.targets.outputs.aws_region != ''
        continue-on-error: true
        env:
          REGION: ${{ steps.targets.outputs.aws_region }}
          KMS_KEY: ${{ steps.targets.outputs.aws_kms }}
          SECRET: ${{ steps.targets.outputs.aws_secret }}
        run: |
          set -euo pipefail
          # Encrypted with the foundation's CMK, like every other secret in
          # this account — which is also the key the monitoring role's scoped
          # kms:Decrypt grant names.
          if aws secretsmanager describe-secret \
                --secret-id "$SECRET" --region "$REGION" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET" --region "$REGION" \
              --secret-string "file://$RUNNER_TEMP/grafana-cloud.json" \
              --query VersionId --output text
          else
            aws secretsmanager create-secret \
              --name "$SECRET" --region "$REGION" \
              --kms-key-id "$KMS_KEY" \
              --description "OneK8s Grafana Cloud credentials (${TF_ENV})" \
              --secret-string "file://$RUNNER_TEMP/grafana-cloud.json" \
              --query ARN --output text
          fi

      - name: Push to GCP Secret Manager
        id: gcp
        if: steps.targets.outputs.gcp_project != ''
        continue-on-error: true
        env:
          PROJECT: ${{ steps.targets.outputs.gcp_project }}
        run: |
          set -euo pipefail
          # Secret Manager IDs are flat, so the object keeps the name it has in
          # Key Vault.
          if gcloud secrets describe "$SECRET_NAME" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud secrets versions add "$SECRET_NAME" --project "$PROJECT" \
              --data-file="$RUNNER_TEMP/grafana-cloud.json"
          else
            gcloud secrets create "$SECRET_NAME" --project "$PROJECT" \
              --replication-policy=automatic \
              --data-file="$RUNNER_TEMP/grafana-cloud.json"
          fi

      - name: Push to OCI Vault
        id: oci
        if: steps.targets.outputs.oci_vault != ''
        continue-on-error: true
        env:
          VAULT_ID: ${{ steps.targets.outputs.oci_vault }}
          KEY_ID: ${{ steps.targets.outputs.oci_key }}
          COMPARTMENT: ${{ steps.targets.outputs.oci_compartment }}
          REGION: ${{ steps.targets.outputs.oci_region }}
        run: |
          set -euo pipefail
          # OCI takes secret content base64-encoded, and a name is unique per
          # vault: an existing secret gets a new version, it is not recreated.
          content="$(base64 -w0 "$RUNNER_TEMP/grafana-cloud.json")"
          existing="$(oci vault secret list \
            --compartment-id "$COMPARTMENT" --vault-id "$VAULT_ID" \
            --name "$SECRET_NAME" --region "$REGION" --all \
            --query "data[?\"lifecycle-state\"!='DELETED'] | [0].id" \
            --raw-output || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            oci vault secret update-base64 \
              --secret-id "$existing" --region "$REGION" \
              --secret-content-content "$content" \
              --query 'data.id' --raw-output
          else
            oci vault secret create-base64 \
              --compartment-id "$COMPARTMENT" --vault-id "$VAULT_ID" \
              --key-id "$KEY_ID" --secret-name "$SECRET_NAME" --region "$REGION" \
              --description "OneK8s Grafana Cloud credentials (${TF_ENV})" \
              --secret-content-content "$content" \
              --query 'data.id' --raw-output
          fi

      - name: Summary
        if: always()
        env:
          VAULT: ${{ steps.targets.outputs.vault }}
          AWS_SECRET: ${{ steps.targets.outputs.aws_secret }}
          TRACES: ${{ steps.payload.outputs.traces }}
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          GCP_OUTCOME: ${{ steps.gcp.outcome }}
          OCI_OUTCOME: ${{ steps.oci.outcome }}
          AWS_TARGET: ${{ steps.targets.outputs.aws_region }}
          GCP_TARGET: ${{ steps.targets.outputs.gcp_project }}
          OCI_TARGET: ${{ steps.targets.outputs.oci_vault }}
        run: |
          # A push that did not run has two quite different causes: the cloud
          # has no foundation here, or the run failed before reaching it.
          row() { # <cloud> <target> <object name> <outcome> <resolved target>
            case "$4" in
              success) result="updated" ;;
              failure) result="**failed** — see the \"Push to $2\" step" ;;
              *) if [ -z "$5" ]; then
                   result="skipped — no $1 foundation in \`${TF_ENV}\`"
                 else
                   result="not attempted — the run stopped earlier"
                 fi ;;
            esac
            echo "| $2 | \`$3\` | $result |"
          }
          {
            echo "### Grafana Cloud credentials — ${TF_ENV}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Object | \`${SECRET_NAME}\` |"
            echo "| Metrics instance | \`${METRICS_USERNAME}\` |"
            echo "| Logs instance | \`${LOGS_USERNAME}\` |"
            echo "| Traces instance | ${TRACES} |"
            echo
            echo "| Target | Name | Result |"
            echo "|---|---|---|"
            echo "| Azure Key Vault (source of truth) | \`${SECRET_NAME}\` | updated |"
            row aws "AWS Secrets Manager" "${AWS_SECRET}" "$AWS_OUTCOME" "$AWS_TARGET"
            row gcp "GCP Secret Manager" "${SECRET_NAME}" "$GCP_OUTCOME" "$GCP_TARGET"
            row oci "OCI Vault" "${SECRET_NAME}" "$OCI_OUTCOME" "$OCI_TARGET"
            echo
            echo "Each cluster with \`enable_monitoring = true\` picks the new"
            echo "credentials up on its next External Secrets refresh, within the hour."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the distribution
        env:
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          GCP_OUTCOME: ${{ steps.gcp.outcome }}
          OCI_OUTCOME: ${{ steps.oci.outcome }}
        run: |
          failed=""
          if [ "$AWS_OUTCOME" = "failure" ]; then failed="$failed AWS"; fi
          if [ "$GCP_OUTCOME" = "failure" ]; then failed="$failed GCP"; fi
          if [ "$OCI_OUTCOME" = "failure" ]; then failed="$failed OCI"; fi
          if [ -n "$failed" ]; then
            echo "::error::the credentials were not published to:$failed" >&2
            exit 1
          fi
          echo "Publication complete."

      - name: Log out of Azure
        if: always()
        run: az logout --output none || true
