name: Renew Certificate

# Issuance and renewal of the platform wildcard certificate:
#
#   Let's Encrypt --(DNS-01 in Azure DNS)--> lego --> Key Vault --> AKS
#
# and, in "distribute" mode, the copy of that certificate out to the secret
# backend of every other cloud:
#
#   Key Vault --> Secrets Manager (AWS) / Secret Manager (GCP) / Vault (OCI)
#
# The target vault is the one the Azure foundation created for the
# environment — the same vault tenants read their secrets from — so the vault
# name is not configuration here: it is read out of the foundation's remote
# state, the way the tenants stack reads everything else. Distribution reads
# the other three foundations the same way, so the certificate lands in the
# vault each cluster already reads from and there are still no per-cloud
# coordinates to keep in sync.
#
# The same two hops carry one more value: the tenant **test secret** the hello
# application reads on every cloud (docs/hello-app.md in OneK8s-hello). It is generated here,
# beside the certificate, because it travels exactly the same road — one Key
# Vault as the source of truth, one distribute run to publish it — and because
# a value that rotates by itself is what turns "a rotated secret reaches the
# page without a restart" into something the platform demonstrates instead of
# claims.
#
# Key Vault is also the only state this workflow keeps. Nothing is carried
# between runs on disk: the certificate already in the vault decides whether a
# renewal is due, and the ACME account key sits next to it as a secret so
# every run reuses the same Let's Encrypt account instead of registering a new
# one. Distribution is likewise stateless — Key Vault is the source of truth
# and the other clouds hold copies of it.
#
# Every object here uses the reserved "platform-" prefix, which no tenant may
# claim — tenant identities are scoped to their own "<tenant>-" prefix by the
# Key Vault ABAC conditions in modules/tenant-namespace/azure and by their
# equivalents on the other clouds. The test secret is the one deliberate
# exception: it is named "<tenant>-test", inside the prefix the tenant's own
# identity may read, because being readable by exactly that identity is the
# whole point of it.
on:
  schedule:
    # Monthly, and always a renewal: distribution is a deliberate act, so it
    # only ever runs from workflow_dispatch. A run with nothing to renew exits
    # before ACME is contacted, so a run outside the renewal window costs
    # nothing — but at this interval only one or two runs fall inside the
    # window, so a bad day (Let's Encrypt outage, DNS hiccup) is worth a
    # manual re-run rather than waiting for the next month.
    - cron: "17 3 12 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "renew: issue/renew into Key Vault. distribute: copy the Key Vault certificate to AWS, GCP and OCI"
        required: true
        default: "renew"
        type: choice
        options: [renew, distribute]
      environment:
        description: "Environment whose foundation (and Key Vault) to renew for"
        required: true
        default: "prototype"
        type: choice
        options: [prototype, dev, staging, prod]
      domains:
        description: "Comma-separated SANs; the first one names the certificate (renew only)"
        required: false
        default: "*.onek8s.lol,onek8s.lol"
        type: string
      certificate_name:
        description: "Key Vault certificate name (alphanumerics and dashes only)"
        required: false
        default: "platform-wildcard-onek8s-lol"
        type: string
      tenant:
        description: "Tenant whose test secret travels with the certificate; must match platform_apps.tenant in gitops/envs/<env>.tfvars"
        required: false
        default: "team-alpha"
        type: string
      acme_server:
        description: "letsencrypt (trusted, rate-limited) or letsencrypt-staging (untrusted, for testing) (renew only)"
        required: false
        default: "letsencrypt"
        type: choice
        options: [letsencrypt, letsencrypt-staging]
      force:
        description: "Renew even if the certificate in the vault is not due yet (renew only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  renew:
    # Scheduled runs pass no inputs, so the default is the renewal.
    if: inputs.mode != 'distribute'
    name: ${{ inputs.certificate_name || 'platform-wildcard-onek8s-lol' }} (${{ inputs.environment || 'prototype' }})
    runs-on: ubuntu-latest
    # Same GitHub environment as the Azure foundation deploys, so the vault's
    # credentials are configured in exactly one place. Note that protection
    # rules apply to scheduled runs too: an environment with required
    # reviewers will hold the renewal until someone approves it.
    environment: azure-${{ inputs.environment || 'prototype' }}
    concurrency:
      # One issuance at a time per vault; never cancel a run mid-order, it
      # would leave the DNS-01 TXT records behind.
      group: renew-certificate-${{ inputs.environment || 'prototype' }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_ENV: ${{ inputs.environment || 'prototype' }}
      # Reads the foundation state out of the Azure Storage state home and
      # authenticates the az CLI against Key Vault.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # lego's azuredns provider reads its credentials from AZURE_* directly.
      # AZURE_SUBSCRIPTION_ID is deliberately left unset: lego locates the
      # zone with a Resource Graph query, and narrowing that query to a
      # subscription only helps when the zone is guaranteed to live there.
      # DNS_ZONE_RESOURCE_GROUP is optional and narrows it further.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_ZONE_NAME: ${{ vars.DNS_ZONE_NAME || 'onek8s.lol' }}
      AZURE_RESOURCE_GROUP: ${{ vars.DNS_ZONE_RESOURCE_GROUP }}
      # Certificate identity and renewal policy.
      DOMAINS: ${{ inputs.domains || '*.onek8s.lol,onek8s.lol' }}
      CERT_NAME: ${{ inputs.certificate_name || 'platform-wildcard-onek8s-lol' }}
      # The tenant test secret rides along with the certificate. Its Key Vault
      # name is "<tenant>-<name>", which is the remote key the hello chart asks
      # for — TENANT is gitops/envs/<env>.tfvars "platform_apps.tenant" and
      # TEST_SECRET is the "secret.name" of the hello application's chart
      # (apps/hello/chart/values.yaml in the OneK8s-hello repository), and the
      # ApplicationSets that deploy it turn the two into the remote key.
      TENANT: ${{ inputs.tenant || 'team-alpha' }}
      TEST_SECRET: test
      ACME_SERVER: ${{ inputs.acme_server || 'letsencrypt' }}
      ACME_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
      # An ACME account belongs to one directory: production and staging know
      # nothing of each other's keys, so they get a secret each. Sharing one
      # would make every switch between them fail to resolve the account.
      ACCOUNT_SECRET_NAME: platform-${{ inputs.acme_server || 'letsencrypt' }}-account-key
      # Renew once the certificate has fewer than this many days left. Let's
      # Encrypt issues for 90 days and starts warning at 20.
      RENEW_DAYS: "30"
      FORCE: ${{ inputs.force || false }}
      # Pinned so a renewal never picks up an unreviewed ACME client.
      LEGO_VERSION: v5.3.1
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          missing=""
          [ -n "$ARM_CLIENT_ID" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$ARM_TENANT_ID" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$ARM_SUBSCRIPTION_ID" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -n "$ARM_CLIENT_SECRET" ] || missing="$missing AZURE_CLIENT_SECRET"
          [ -n "$ACME_EMAIL" ] || missing="$missing LETSENCRYPT_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables/secrets:$missing" >&2
            echo "See docs/getting-started.md, 'Wildcard certificate renewal'." >&2
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # The vault is addressed by convention, not by configuration: whichever
      # Key Vault this environment's Azure foundation built is the one the
      # cluster reads from, so it is the one the certificate belongs in.
      - name: Resolve the Key Vault from the foundation state
        id: vault
        working-directory: foundations/azure
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="backend/${TF_ENV}.hcl"
          uri="$(terraform output -raw key_vault_uri)"
          if [ -z "$uri" ]; then
            echo "::error::foundations/azure has no key_vault_uri output for ${TF_ENV}; deploy the foundation first" >&2
            exit 1
          fi
          # https://<name>.vault.azure.net/ -> <name>
          name="${uri#https://}"
          name="${name%%.*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Key Vault: $name ($uri)"

      - name: Log in to Azure
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" \
            --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      # A missing certificate and an expiring one are the same case: issue.
      # Anything else that goes wrong talking to the vault is not — a denied
      # read must fail the run rather than silently trigger a fresh order.
      - name: Decide whether a renewal is due
        id: due
        env:
          VAULT: ${{ steps.vault.outputs.name }}
        run: |
          set -euo pipefail
          if expires="$(az keyvault certificate show \
                --vault-name "$VAULT" --name "$CERT_NAME" \
                --query attributes.expires -o tsv \
                --only-show-errors 2>/tmp/kv-err)"; then
            left=$(( ( $(date -u -d "$expires" +%s) - $(date -u +%s) ) / 86400 ))
            echo "$CERT_NAME expires $expires ($left days left)"
            echo "expires=$expires" >> "$GITHUB_OUTPUT"
            if [ "$left" -ge "$RENEW_DAYS" ] && [ "$FORCE" != "true" ]; then
              echo "renew=false" >> "$GITHUB_OUTPUT"
              echo "Nothing to do: renewal starts at $RENEW_DAYS days left."
              exit 0
            fi
          elif grep -qiE 'not found|CertificateNotFound' /tmp/kv-err; then
            echo "No $CERT_NAME in $VAULT yet; issuing for the first time."
          else
            cat /tmp/kv-err >&2
            exit 1
          fi
          echo "renew=true" >> "$GITHUB_OUTPUT"

      - name: Install lego
        if: steps.due.outputs.renew == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o lego.tar.gz \
            "https://github.com/go-acme/lego/releases/download/${LEGO_VERSION}/lego_${LEGO_VERSION}_linux_amd64.tar.gz"
          tar -xzf lego.tar.gz lego
          sudo install -m 0755 lego /usr/local/bin/lego
          lego --version

      # Let's Encrypt identifies the account by its key, so recovering the
      # stored one keeps every renewal on the same account (and its rate
      # limits). The first run has no key to recover and lets `lego run`
      # register, after which the generated key is put in the vault.
      - name: Restore the ACME account
        id: account
        if: steps.due.outputs.renew == 'true'
        env:
          VAULT: ${{ steps.vault.outputs.name }}
        run: |
          set -euo pipefail
          if az keyvault secret download \
                --vault-name "$VAULT" --name "$ACCOUNT_SECRET_NAME" \
                --file acme-account.key --encoding utf-8 \
                --only-show-errors 2>/tmp/kv-err; then
            # `accounts recover` asks for confirmation on stdin.
            printf 'y\n' | lego accounts recover \
              --path .lego \
              --server "$ACME_SERVER" \
              --email "$ACME_EMAIL" \
              --private-key acme-account.key
            echo "restored=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|SecretNotFound' /tmp/kv-err; then
            echo "No ACME account key in $VAULT; lego will register a new account."
            echo "restored=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/kv-err >&2
            exit 1
          fi

      - name: Obtain the certificate from Let's Encrypt
        if: steps.due.outputs.renew == 'true'
        run: |
          set -euo pipefail
          lego run \
            --path .lego \
            --server "$ACME_SERVER" \
            --email "$ACME_EMAIL" \
            --accept-tos \
            --key-type RSA2048 \
            --cert.name "$CERT_NAME" \
            --domains "$DOMAINS" \
            --dns azuredns

      - name: Store the new ACME account key
        if: steps.due.outputs.renew == 'true' && steps.account.outputs.restored == 'false'
        env:
          VAULT: ${{ steps.vault.outputs.name }}
        run: |
          set -euo pipefail
          key="$(find .lego/accounts -type f -name '*.key' -print -quit)"
          if [ -z "$key" ]; then
            echo "::error::lego registered an account but left no key under .lego/accounts" >&2
            exit 1
          fi
          az keyvault secret set \
            --vault-name "$VAULT" --name "$ACCOUNT_SECRET_NAME" \
            --file "$key" --encoding utf-8 \
            --only-show-errors --output none
          echo "Stored the Let's Encrypt account key as $ACCOUNT_SECRET_NAME."

      # Key Vault imports a PEM bundle of key + chain, but wants the key in
      # PKCS#8; lego writes PKCS#1 (RSA) or SEC1 (EC), so convert it here
      # instead of relying on the format lego happened to pick.
      - name: Import the certificate into Key Vault
        if: steps.due.outputs.renew == 'true'
        id: import
        env:
          VAULT: ${{ steps.vault.outputs.name }}
        run: |
          set -euo pipefail
          crt="$(find .lego/certificates -name '*.crt' ! -name '*.issuer.crt' -print -quit)"
          key="${crt%.crt}.key"
          if [ ! -s "$crt" ] || [ ! -s "$key" ]; then
            echo "::error::lego produced no certificate under .lego/certificates" >&2
            exit 1
          fi
          openssl pkcs8 -topk8 -nocrypt -in "$key" -out key.pkcs8.pem
          cat key.pkcs8.pem "$crt" > import.pem
          imported="$(az keyvault certificate import \
            --vault-name "$VAULT" --name "$CERT_NAME" \
            --file import.pem \
            --only-show-errors --query '[id, attributes.expires]' -o tsv)"
          IFS=$'\t' read -r id expires <<< "$imported"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "expires=$expires" >> "$GITHUB_OUTPUT"
          echo "Imported $id (expires $expires)"

      # The tenant test secret, generated next to the certificate and rotated
      # with it. Two cases write a new version: the certificate was renewed
      # (so the pair stays in step, and every renewal exercises the rotation
      # path end to end), or the secret is not in the vault at all — which is
      # what seeds a fresh environment on the first run, without waiting for
      # the certificate to come due.
      #
      # The value is not confidential: the hello page publishes it verbatim on
      # a public host, and being able to compare that page against this run is
      # most of what it is for. It carries the run that wrote it, so which
      # renewal a given page is showing is never a guess.
      - name: Generate the tenant test secret
        id: test_secret
        env:
          VAULT: ${{ steps.vault.outputs.name }}
          RENEWED: ${{ steps.due.outputs.renew }}
        run: |
          set -euo pipefail
          name="${TENANT}-${TEST_SECRET}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          if az keyvault secret show \
                --vault-name "$VAULT" --name "$name" \
                --query id -o tsv --only-show-errors >/dev/null 2>/tmp/kv-err; then
            exists=true
          elif grep -qiE 'not found|SecretNotFound' /tmp/kv-err; then
            exists=false
          else
            cat /tmp/kv-err >&2
            exit 1
          fi

          if [ "$exists" = "true" ] && [ "$RENEWED" != "true" ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "$name is already in $VAULT and nothing was renewed; leaving it as it is."
            exit 0
          fi

          # Written to a file rather than passed as an argument, like every
          # other value this workflow hands to a CLI.
          value="$RUNNER_TEMP/test-secret.txt"
          printf 'OneK8s %s test secret — issued %s by run %s (%s)' \
            "$TF_ENV" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" \
            "$(openssl rand -hex 4)" > "$value"

          az keyvault secret set \
            --vault-name "$VAULT" --name "$name" \
            --file "$value" --encoding utf-8 \
            --only-show-errors --output none

          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "value=$(cat "$value")" >> "$GITHUB_OUTPUT"
          if [ "$exists" = "true" ]; then
            echo "Rotated $name in $VAULT."
          else
            echo "Seeded $name in $VAULT."
          fi
          echo "Run this workflow in distribute mode to publish it to AWS, GCP and OCI."

      - name: Summary
        env:
          VAULT: ${{ steps.vault.outputs.name }}
          TEST_SECRET_NAME: ${{ steps.test_secret.outputs.name }}
          TEST_SECRET_GENERATED: ${{ steps.test_secret.outputs.generated }}
          TEST_SECRET_VALUE: ${{ steps.test_secret.outputs.value }}
        run: |
          {
            echo "### Wildcard certificate — ${TF_ENV}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Domains | \`${DOMAINS}\` |"
            echo "| Key Vault | \`${VAULT}\` |"
            echo "| Certificate | \`${CERT_NAME}\` |"
            echo "| ACME server | \`${ACME_SERVER}\` |"
            if [ "${{ steps.due.outputs.renew }}" = "true" ]; then
              echo "| Action | renewed |"
              echo "| Expires | ${{ steps.import.outputs.expires }} |"
              echo "| Version | \`${{ steps.import.outputs.id }}\` |"
            else
              echo "| Action | skipped — more than ${RENEW_DAYS} days left |"
              echo "| Expires | ${{ steps.due.outputs.expires }} |"
            fi
            echo
            echo "### Tenant test secret — \`${TEST_SECRET_NAME}\`"
            echo
            if [ "$TEST_SECRET_GENERATED" = "true" ]; then
              echo "Written to the vault by this run. It reaches AWS, GCP and OCI on"
              echo "the next \`distribute\` run, and the hello pages within the hour"
              echo "after that:"
              echo
              echo "> ${TEST_SECRET_VALUE}"
            else
              echo "Unchanged — the certificate was not renewed, and the secret is"
              echo "already in the vault."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Azure
        if: always()
        run: az logout --output none || true

  # Key Vault is the source of truth; the other three clouds hold copies, so
  # that a workload on EKS, GKE or OKE reads the platform certificate out of
  # the same backend it already reads its tenant secrets from instead of
  # reaching across clouds for it. Nothing here talks to Let's Encrypt: a
  # distribution run publishes whatever version the vault currently holds.
  distribute:
    if: inputs.mode == 'distribute'
    name: ${{ inputs.certificate_name || 'platform-wildcard-onek8s-lol' }} -> AWS, GCP, OCI (${{ inputs.environment || 'prototype' }})
    runs-on: ubuntu-latest
    # The same environment the renewal binds to: the run's privileged input is
    # the Azure Key Vault it reads the private key out of, and pinning both
    # jobs to one environment keeps the vault's credentials configured in a
    # single place. The credentials it writes with are the repository-level
    # AWS/GCP/OCI ones — see docs/architecture.md, "Known trade-offs".
    environment: azure-${{ inputs.environment || 'prototype' }}
    concurrency:
      # Deliberately the renewal's group: a distribution must not read the
      # vault while an import is replacing the certificate in it.
      group: renew-certificate-${{ inputs.environment || 'prototype' }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_ENV: ${{ inputs.environment || 'prototype' }}
      # Reads every foundation's state out of the Azure Storage state home and
      # authenticates the az CLI against Key Vault. No DNS access is needed
      # here — nothing solves a challenge in this job.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # The OCI CLI reads its credentials straight from the environment.
      OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CLI_USER: ${{ vars.OCI_USER_OCID }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      CERT_NAME: ${{ inputs.certificate_name || 'platform-wildcard-onek8s-lol' }}
      # The tenant test secret is published by the same three pushes as the
      # certificate — same source vault, same targets, same naming rules. See
      # the renew job, which is where it is generated.
      TENANT: ${{ inputs.tenant || 'team-alpha' }}
      TEST_SECRET: test
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          missing=""
          [ -n "$ARM_CLIENT_ID" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$ARM_TENANT_ID" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$ARM_SUBSCRIPTION_ID" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -n "$ARM_CLIENT_SECRET" ] || missing="$missing AZURE_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables/secrets:$missing" >&2
            echo "See docs/getting-started.md, 'Wildcard certificate renewal'." >&2
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Every coordinate this job needs comes out of a foundation state, so a
      # cloud that has no foundation in this environment simply has no target
      # and is skipped — and, because that is decided here, its credentials
      # are never configured either. Azure is the exception: without it there
      # is no certificate to distribute at all.
      - name: Resolve the source vault and the targets
        id: targets
        run: |
          set -euo pipefail
          foundation_ready() {
            [ -f "foundations/$1/backend/${TF_ENV}.hcl" ] &&
              terraform -chdir="foundations/$1" init -input=false \
                -backend-config="backend/${TF_ENV}.hcl" >/dev/null 2>&1
          }
          read_output() {
            terraform -chdir="foundations/$1" output -raw "$2" 2>/dev/null || true
          }

          if ! foundation_ready azure; then
            echo "::error::cannot read the foundations/azure state for ${TF_ENV}" >&2
            exit 1
          fi
          uri="$(read_output azure key_vault_uri)"
          if [ -z "$uri" ]; then
            echo "::error::foundations/azure has no key_vault_uri output for ${TF_ENV}; there is nothing to distribute" >&2
            exit 1
          fi
          # https://<name>.vault.azure.net/ -> <name>
          vault="${uri#https://}"
          vault="${vault%%.*}"
          echo "vault=$vault" >> "$GITHUB_OUTPUT"
          echo "Source: Key Vault $vault ($uri)"

          aws_region=""; aws_kms=""
          if foundation_ready aws; then
            aws_region="$(read_output aws region)"
            aws_kms="$(read_output aws secrets_kms_key_arn)"
          fi
          if [ -z "$aws_region" ] || [ -z "$aws_kms" ]; then
            echo "::warning::foundations/aws is not deployed for ${TF_ENV}; skipping AWS."
            aws_region=""; aws_kms=""
          else
            echo "AWS: Secrets Manager in $aws_region"
          fi
          {
            echo "aws_region=$aws_region"
            echo "aws_kms=$aws_kms"
            # Secrets Manager names are hierarchical ("<env>/<tenant>/<name>"),
            # and the platform is the reserved "platform" tenant, so the
            # certificate keeps the same place in that layout as everything
            # else in the vault. The test secret belongs to a real tenant, so
            # it lands under that tenant's path — which is exactly the prefix
            # its IAM role is restricted to.
            echo "aws_secret=${TF_ENV}/platform/${CERT_NAME#platform-}"
            echo "aws_test_secret=${TF_ENV}/${TENANT}/${TEST_SECRET}"
          } >> "$GITHUB_OUTPUT"

          gcp_project=""
          if foundation_ready gcp; then
            gcp_project="$(read_output gcp project_id)"
          fi
          if [ -z "$gcp_project" ]; then
            echo "::warning::foundations/gcp is not deployed for ${TF_ENV}; skipping GCP."
          else
            echo "GCP: Secret Manager in project $gcp_project"
          fi
          echo "gcp_project=$gcp_project" >> "$GITHUB_OUTPUT"

          oci_vault=""; oci_key=""; oci_compartment=""; oci_region=""
          if foundation_ready oci; then
            oci_vault="$(read_output oci vault_id)"
            oci_key="$(read_output oci vault_key_id)"
            oci_compartment="$(read_output oci compartment_id)"
            oci_region="$(read_output oci region)"
          fi
          if [ -z "$oci_vault" ] || [ -z "$oci_key" ] || [ -z "$oci_compartment" ]; then
            echo "::warning::foundations/oci is not deployed for ${TF_ENV}; skipping OCI."
            oci_vault=""; oci_key=""; oci_compartment=""; oci_region=""
          else
            echo "OCI: Vault $oci_vault in $oci_region"
          fi
          {
            echo "oci_vault=$oci_vault"
            echo "oci_key=$oci_key"
            echo "oci_compartment=$oci_compartment"
            echo "oci_region=$oci_region"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.targets.outputs.aws_region != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.targets.outputs.aws_region }}

      - name: Authenticate to GCP
        if: steps.targets.outputs.gcp_project != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up gcloud
        if: steps.targets.outputs.gcp_project != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Install OCI CLI
        if: steps.targets.outputs.oci_vault != ''
        run: |
          curl -sSfL https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            | bash -s -- --accept-all-defaults
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Log in to Azure
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" \
            --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      # Everything below the vault handles a private key, so it stays in files
      # under RUNNER_TEMP — outside the workspace, and out of step outputs and
      # the log. The AWS and GCP CLIs read it from that file directly; the OCI
      # CLI has no file form for secret content, so there alone it is passed
      # as an argument.
      - name: Fetch the certificate from Key Vault
        id: fetch
        env:
          VAULT: ${{ steps.targets.outputs.vault }}
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/secret.raw"
          if ! az keyvault secret download \
                --vault-name "$VAULT" --name "$CERT_NAME" \
                --file "$raw" --encoding utf-8 \
                --only-show-errors 2>/tmp/kv-err; then
            if grep -qiE 'not found|SecretNotFound|CertificateNotFound' /tmp/kv-err; then
              echo "::error::no certificate $CERT_NAME in $VAULT; run this workflow in renew mode first" >&2
            fi
            cat /tmp/kv-err >&2
            exit 1
          fi

          # A certificate imported as PEM comes back as PEM; one imported as
          # PKCS#12 comes back as the base64 of the .pfx. Sniff the content
          # rather than trusting contentType, and end up with one bundle
          # either way.
          bundle="$RUNNER_TEMP/bundle.pem"
          if grep -q -- '-----BEGIN' "$raw"; then
            cp "$raw" "$bundle"
          else
            base64 -d < "$raw" > "$RUNNER_TEMP/bundle.pfx"
            openssl pkcs12 -in "$RUNNER_TEMP/bundle.pfx" -passin pass: -nodes -out "$bundle"
          fi

          crt="$RUNNER_TEMP/tls.crt"
          key="$RUNNER_TEMP/tls.key"
          # Keep the whole chain, in order, and drop everything that is not a
          # certificate: the private key, and the bag attributes openssl
          # writes ahead of each PKCS#12 entry.
          awk '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/' "$bundle" > "$crt"
          # PKCS#8, whatever the vault handed back. A bundle with no private
          # key in it leaves the file empty, which the check below reports.
          openssl pkey -in "$bundle" -out "$key" || true
          if [ ! -s "$crt" ] || [ ! -s "$key" ]; then
            echo "::error::$CERT_NAME in $VAULT holds no certificate/key pair" >&2
            exit 1
          fi

          # A key and a leaf that do not belong together would break TLS on
          # three clouds at once, so they are checked before anything is
          # published rather than after.
          if [ "$(openssl x509 -in "$crt" -noout -pubkey)" != "$(openssl pkey -in "$key" -pubout)" ]; then
            echo "::error::the private key of $CERT_NAME does not match its certificate" >&2
            exit 1
          fi

          # One JSON object per cloud, so the key and the certificate it
          # belongs to are written — and read — as a single atomic version.
          # The field names are Kubernetes' TLS secret keys, so an
          # ExternalSecret maps them straight through with remoteRef.property.
          jq -n --rawfile crt "$crt" --rawfile key "$key" \
            '{"tls.crt": $crt, "tls.key": $key}' > "$RUNNER_TEMP/payload.json"

          expires="$(openssl x509 -in "$crt" -noout -enddate | cut -d= -f2)"
          echo "expires=$(date -u -d "$expires" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "subject=$(openssl x509 -in "$crt" -noout -subject | sed 's/^subject=[[:space:]]*//')" >> "$GITHUB_OUTPUT"
          openssl x509 -in "$crt" -noout -subject -ext subjectAltName -enddate

          # The tenant test secret, fetched from the same vault in the same
          # step because it is published by the same three pushes below. It is
          # a plain secret, not a certificate, so its value carries over
          # verbatim — an environment whose renewal has never run has none yet,
          # which is a warning and not a failure: the certificate is what this
          # job exists for.
          test_name="${TENANT}-${TEST_SECRET}"
          if az keyvault secret download \
                --vault-name "$VAULT" --name "$test_name" \
                --file "$RUNNER_TEMP/test-secret.txt" --encoding utf-8 \
                --only-show-errors 2>/tmp/kv-err; then
            echo "test_name=$test_name" >> "$GITHUB_OUTPUT"
            echo "Test secret: $test_name"
          elif grep -qiE 'not found|SecretNotFound' /tmp/kv-err; then
            echo "::warning::no $test_name in $VAULT; skipping the test secret. Run this workflow in renew mode to generate it."
            echo "test_name=" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/kv-err >&2
            exit 1
          fi

      # The three pushes are independent: one cloud refusing the write must
      # not keep the other two on a stale certificate, so each is allowed to
      # fail on its own and the job is failed at the end by the outcome check.
      # Each publishes both objects, so a cloud is either current on the pair
      # or reported as failed.
      - name: Push to AWS Secrets Manager
        id: aws
        if: steps.targets.outputs.aws_region != ''
        continue-on-error: true
        env:
          REGION: ${{ steps.targets.outputs.aws_region }}
          KMS_KEY: ${{ steps.targets.outputs.aws_kms }}
          SECRET: ${{ steps.targets.outputs.aws_secret }}
          TEST_SECRET_ID: ${{ steps.targets.outputs.aws_test_secret }}
          TEST_NAME: ${{ steps.fetch.outputs.test_name }}
        run: |
          set -euo pipefail
          # Encrypted with the foundation's CMK, the same key the tenant
          # secrets in this account use — which is also what makes the test
          # secret readable by the tenant, whose kms:Decrypt grant is scoped
          # to exactly that key.
          put() { # <secret id> <payload file> <description>
            if aws secretsmanager describe-secret \
                  --secret-id "$1" --region "$REGION" >/dev/null 2>&1; then
              aws secretsmanager put-secret-value \
                --secret-id "$1" --region "$REGION" \
                --secret-string "file://$2" \
                --query VersionId --output text
            else
              aws secretsmanager create-secret \
                --name "$1" --region "$REGION" \
                --kms-key-id "$KMS_KEY" \
                --description "$3" \
                --secret-string "file://$2" \
                --query ARN --output text
            fi
          }
          put "$SECRET" "$RUNNER_TEMP/payload.json" \
            "OneK8s platform wildcard certificate (${TF_ENV})"
          if [ -n "$TEST_NAME" ]; then
            put "$TEST_SECRET_ID" "$RUNNER_TEMP/test-secret.txt" \
              "OneK8s ${TENANT} test secret (${TF_ENV})"
          fi

      - name: Push to GCP Secret Manager
        id: gcp
        if: steps.targets.outputs.gcp_project != ''
        continue-on-error: true
        env:
          PROJECT: ${{ steps.targets.outputs.gcp_project }}
          TEST_NAME: ${{ steps.fetch.outputs.test_name }}
        run: |
          set -euo pipefail
          # Secret Manager IDs are flat, so both objects keep the name they
          # have in Key Vault.
          add() { # <secret id> <payload file>
            if gcloud secrets describe "$1" --project "$PROJECT" >/dev/null 2>&1; then
              gcloud secrets versions add "$1" --project "$PROJECT" \
                --data-file="$2"
            else
              gcloud secrets create "$1" --project "$PROJECT" \
                --replication-policy=automatic \
                --data-file="$2"
            fi
          }
          add "$CERT_NAME" "$RUNNER_TEMP/payload.json"
          if [ -n "$TEST_NAME" ]; then
            add "$TEST_NAME" "$RUNNER_TEMP/test-secret.txt"
          fi

      - name: Push to OCI Vault
        id: oci
        if: steps.targets.outputs.oci_vault != ''
        continue-on-error: true
        env:
          VAULT_ID: ${{ steps.targets.outputs.oci_vault }}
          KEY_ID: ${{ steps.targets.outputs.oci_key }}
          COMPARTMENT: ${{ steps.targets.outputs.oci_compartment }}
          REGION: ${{ steps.targets.outputs.oci_region }}
          TEST_NAME: ${{ steps.fetch.outputs.test_name }}
        run: |
          set -euo pipefail
          # OCI takes secret content base64-encoded, and a name is unique per
          # vault: an existing secret gets a new version, it is not recreated.
          publish() { # <secret name> <payload file> <description>
            local content existing
            content="$(base64 -w0 "$2")"
            existing="$(oci vault secret list \
              --compartment-id "$COMPARTMENT" --vault-id "$VAULT_ID" \
              --name "$1" --region "$REGION" --all \
              --query "data[?\"lifecycle-state\"!='DELETED'] | [0].id" \
              --raw-output || true)"
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              oci vault secret update-base64 \
                --secret-id "$existing" --region "$REGION" \
                --secret-content-content "$content" \
                --query 'data.id' --raw-output
            else
              oci vault secret create-base64 \
                --compartment-id "$COMPARTMENT" --vault-id "$VAULT_ID" \
                --key-id "$KEY_ID" --secret-name "$1" --region "$REGION" \
                --description "$3" \
                --secret-content-content "$content" \
                --query 'data.id' --raw-output
            fi
          }
          publish "$CERT_NAME" "$RUNNER_TEMP/payload.json" \
            "OneK8s platform wildcard certificate (${TF_ENV})"
          if [ -n "$TEST_NAME" ]; then
            publish "$TEST_NAME" "$RUNNER_TEMP/test-secret.txt" \
              "OneK8s ${TENANT} test secret (${TF_ENV})"
          fi

      - name: Summary
        if: always()
        env:
          VAULT: ${{ steps.targets.outputs.vault }}
          SUBJECT: ${{ steps.fetch.outputs.subject }}
          EXPIRES: ${{ steps.fetch.outputs.expires }}
          AWS_SECRET: ${{ steps.targets.outputs.aws_secret }}
          AWS_TEST_SECRET: ${{ steps.targets.outputs.aws_test_secret }}
          TEST_NAME: ${{ steps.fetch.outputs.test_name }}
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          GCP_OUTCOME: ${{ steps.gcp.outcome }}
          OCI_OUTCOME: ${{ steps.oci.outcome }}
          AWS_TARGET: ${{ steps.targets.outputs.aws_region }}
          GCP_TARGET: ${{ steps.targets.outputs.gcp_project }}
          OCI_TARGET: ${{ steps.targets.outputs.oci_vault }}
        run: |
          # A push that did not run has two quite different causes: the cloud
          # has no foundation here, or the run failed before reaching it.
          row() { # <cloud> <target> <cert name> <test secret name> <outcome> <resolved target>
            case "$5" in
              success) result="updated" ;;
              failure) result="**failed** — see the \"Push to $2\" step" ;;
              *) if [ -z "$6" ]; then
                   result="skipped — no $1 foundation in \`${TF_ENV}\`"
                 else
                   result="not attempted — the run stopped earlier"
                 fi ;;
            esac
            # No test secret in the vault yet: the certificate still went out.
            if [ -n "$TEST_NAME" ]; then
              test_cell="\`$4\`"
            else
              test_cell="— (none in the vault)"
            fi
            echo "| $2 | \`$3\` | $test_cell | $result |"
          }
          if [ -n "$TEST_NAME" ]; then
            source_test="\`${TEST_NAME}\`"
          else
            source_test="— run \`renew\` to generate it"
          fi
          {
            echo "### Wildcard certificate distribution — ${TF_ENV}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source | Key Vault \`${VAULT}\` |"
            echo "| Certificate | \`${CERT_NAME}\` |"
            echo "| Subject | \`${SUBJECT}\` |"
            echo "| Expires | ${EXPIRES} |"
            echo "| Test secret | ${source_test} |"
            echo
            echo "| Target | Certificate | Test secret | Result |"
            echo "|---|---|---|---|"
            row aws "AWS Secrets Manager" "${AWS_SECRET}" "${AWS_TEST_SECRET}" "$AWS_OUTCOME" "$AWS_TARGET"
            row gcp "GCP Secret Manager" "${CERT_NAME}" "${TEST_NAME}" "$GCP_OUTCOME" "$GCP_TARGET"
            row oci "OCI Vault" "${CERT_NAME}" "${TEST_NAME}" "$OCI_OUTCOME" "$OCI_TARGET"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the distribution
        env:
          AWS_OUTCOME: ${{ steps.aws.outcome }}
          GCP_OUTCOME: ${{ steps.gcp.outcome }}
          OCI_OUTCOME: ${{ steps.oci.outcome }}
        run: |
          failed=""
          if [ "$AWS_OUTCOME" = "failure" ]; then failed="$failed AWS"; fi
          if [ "$GCP_OUTCOME" = "failure" ]; then failed="$failed GCP"; fi
          if [ "$OCI_OUTCOME" = "failure" ]; then failed="$failed OCI"; fi
          if [ -n "$failed" ]; then
            echo "::error::the certificate was not distributed to:$failed" >&2
            exit 1
          fi
          echo "Distribution complete."

      - name: Log out of Azure
        if: always()
        run: az logout --output none || true
