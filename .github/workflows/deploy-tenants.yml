name: Deploy Tenants

# Tenants deploy independently of foundations; they only consume foundation
# remote-state outputs. Path filter includes the tenant module so module
# changes roll out to tenants on merge.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "tenants/**"
  #     - "modules/tenant-namespace/**"
  #     - ".github/workflows/deploy-tenants.yml"
  #     - ".github/workflows/_terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud to deploy"
        required: true
        default: "azure"
        type: choice
        options: [all, azure, aws, gcp, oci]
      environment:
        description: "Environment to deploy"
        required: true
        default: "prototype"
        type: choice
        options: [prototype, dev, staging, prod]

permissions:
  contents: read

jobs:
  azure:
    if: github.event_name == 'push' || inputs.cloud == 'all' || inputs.cloud == 'azure'
    uses: ./.github/workflows/_terraform-deploy.yml
    with:
      stack: tenants
      cloud: azure
      environment: ${{ inputs.environment || 'prototype' }}
      config: azure-${{ inputs.environment || 'prototype' }}
    secrets: inherit

  aws:
    if: github.event_name == 'push' || inputs.cloud == 'all' || inputs.cloud == 'aws'
    uses: ./.github/workflows/_terraform-deploy.yml
    with:
      stack: tenants
      cloud: aws
      environment: ${{ inputs.environment || 'prototype' }}
      config: aws-${{ inputs.environment || 'prototype' }}
    secrets: inherit

  gcp:
    if: github.event_name == 'push' || inputs.cloud == 'all' || inputs.cloud == 'gcp'
    uses: ./.github/workflows/_terraform-deploy.yml
    with:
      stack: tenants
      cloud: gcp
      environment: ${{ inputs.environment || 'prototype' }}
      config: gcp-${{ inputs.environment || 'prototype' }}
    secrets: inherit

  oci:
    if: github.event_name == 'push' || inputs.cloud == 'all' || inputs.cloud == 'oci'
    uses: ./.github/workflows/_terraform-deploy.yml
    with:
      stack: tenants
      cloud: oci
      environment: ${{ inputs.environment || 'prototype' }}
      config: oci-${{ inputs.environment || 'prototype' }}
    secrets: inherit
