name: Deploy Tenants

# Tenants deploy independently of foundations; they only consume foundation
# remote-state outputs. One stack, one state file per environment, every cloud
# in a single run — the cloud is a per-tenant parameter in
# tenants/envs/<environment>.tfvars. Path filter includes the tenant module so
# module changes roll out to tenants on merge.
#
# Onboarding a tenant is two jobs, because one of the things a tenant gets
# cannot be a Terraform resource:
#
#   tenants  namespace, quota, netpol, cloud identity, namespaced SecretStore
#   sql      a user in the Azure SQL database for that identity, and the schema
#
# The second one is `db-hello bootstrap` (apps/db-hello/src/Bootstrap.cs) run as
# the SQL server's Entra administrator. CREATE USER is T-SQL executed inside the
# database and has no ARM representation on any provider, so it happens here
# rather than in the stack — but it happens on the same deploy, for every Azure
# tenant, instead of being a separate thing to remember.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "tenants/**"
  #     - "modules/tenant-namespace/**"
  #     - ".github/workflows/deploy-tenants.yml"
  #     - ".github/workflows/_terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "prototype"
        type: choice
        options: [prototype, dev, staging, prod]

permissions:
  contents: read

jobs:
  tenants:
    uses: ./.github/workflows/_terraform-deploy.yml
    with:
      stack: tenants
      # All clouds at once: the run needs every cloud's credentials and CLIs,
      # and binds to the "tenants-<environment>" GitHub environment rather than
      # a per-cloud one.
      cloud: all
      environment: ${{ inputs.environment || 'prototype' }}
      gh_environment: tenants-${{ inputs.environment || 'prototype' }}
    secrets: inherit

  # Database access for the tenants the job above just onboarded. A separate
  # job, so an unreachable database shows up as its own red mark and never
  # touches the apply that already succeeded.
  #
  # The work itself is apps/db-hello/bootstrap.sh, not steps written out here,
  # because an operator who applies the stacks from a laptop needs the same act
  # and CI is not available to them. One script, two callers: this job runs it
  # as the deploy service principal, and `./apps/db-hello/bootstrap.sh` run as
  # the server's Entra administrator does exactly what this job does.
  #
  # It is guarded and idempotent: no SQL server in this environment's Azure
  # foundation (enable_sql = false) or no Azure tenants, and it does nothing —
  # so it runs on every deploy, which is also how a schema change reaches the
  # database.
  sql:
    name: Azure SQL access (${{ inputs.environment || 'prototype' }})
    needs: tenants
    runs-on: ubuntu-latest
    # Same GitHub environment as the apply, so the credentials of the SQL
    # server's Entra administrator are configured in exactly one place.
    environment: tenants-${{ inputs.environment || 'prototype' }}
    concurrency:
      group: tenants-sql-${{ inputs.environment || 'prototype' }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_ENV: ${{ inputs.environment || 'prototype' }}
      # Reads both stacks' state out of the Azure Storage state home, and
      # authenticates the az CLI. This principal is the server's Entra
      # administrator (foundations/azure/sql.tf), which is what lets it create
      # a user for somebody else's identity.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # DefaultAzureCredential reads these; ARM_* is Terraform's spelling of
      # the same service principal.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Log in to Azure
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" \
            --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      # Published once and invoked per tenant by the script. This is the same
      # code the pod runs; the only difference is whose token the interceptor
      # puts on the connection — here the Entra administrator's, in the pod a
      # federated ServiceAccount token.
      - name: Build the bootstrap command
        run: dotnet publish apps/db-hello/src -c Release -o /tmp/db-hello

      - name: Apply the migrations and grant each tenant access
        env:
          DB_HELLO_DLL: /tmp/db-hello/db-hello.dll
        run: |
          # pipefail, or `tee` would swallow a failed bootstrap and leave the
          # job green with a database nobody can log in to.
          set -euo pipefail
          ./apps/db-hello/bootstrap.sh "$TF_ENV" | tee /tmp/bootstrap.out

      - name: Summary
        if: always()
        run: |
          {
            echo "### Azure SQL access (${TF_ENV})"
            echo
            if [ -f /tmp/bootstrap.out ]; then
              echo '```'
              cat /tmp/bootstrap.out
              echo '```'
            else
              echo "_The bootstrap did not run; see the job log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
