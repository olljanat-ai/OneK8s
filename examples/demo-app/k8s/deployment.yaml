# Demo app deployment for a OneK8s tenant namespace. Replace the image
# (CHANGEME) and apply into the tenant namespace — nothing here is
# cloud-specific: the redis-connection ConfigMap and the redis-auth Secret
# are published by the platform (redis_enabled = true), and demo-secret is
# synced by the ExternalSecret next to this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      serviceAccountName: workload
      containers:
        - name: demo-app
          image: CHANGEME.example.com/onek8s-demo:latest
          ports:
            - containerPort: 8080
          env:
            - name: TENANT_NAME
              value: "team-alpha"
            - name: ENVIRONMENT
              value: "dev"
          envFrom:
            # REDIS_HOST/PORT/TLS (+ USERNAME/KEY_PREFIX on AWS):
            - configMapRef:
                name: redis-connection
            # REDIS_PASSWORD, synced from the vault by the platform:
            - secretRef:
                name: redis-auth
            # DEMO_SECRET, synced by k8s/externalsecret.yaml:
            - secretRef:
                name: demo-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
