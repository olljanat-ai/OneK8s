# Syncs the hardcoded demo secret from the shared vault into K8s Secret
# "demo-secret" through the tenant's namespaced SecretStore — this is the
# platform's intended (cloud-agnostic) way for apps to consume vault secrets.
#
# remoteRef.key follows the tenant naming contract:
#   Azure/GCP: team-alpha-demo-secret
#   AWS:       dev/team-alpha/demo-secret   <- adjust when deploying on AWS
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: tenant-store
  target:
    name: demo-secret
  data:
    - secretKey: DEMO_SECRET
      remoteRef:
        key: team-alpha-demo-secret
