{{- if .Values.secret.enabled }}
# The whole point of the app, in seven lines of YAML: it names a secret and a
# store, and never a credential. Authentication is the tenant's ServiceAccount
# federated into the tenant's cloud identity — or, on the private cloud, into a
# Vault role — and that identity can only read this tenant's slice of the
# shared backend, enforced by Key Vault ABAC, an IAM ARN prefix, a Secret
# Manager IAM condition, an OCI policy condition or a Vault path policy,
# depending on which cluster this landed on.
# See docs/adr/0001-per-tenant-identities-and-namespaced-secretstores.md.
#
# "tenant-store" is a SecretStore, not a ClusterSecretStore: it exists only in
# this namespace and only ExternalSecrets in this namespace may reference it.
#
# dataFrom/extract, not data/remoteRef: every secret this platform stores is a
# JSON object of fields (see docs/architecture.md, "Secret isolation"), so
# extracting one maps its fields straight through under their own names. That
# is what keeps this manifest byte-identical on all five clouds — a
# `property:` would otherwise be needed on Vault, whose KV v2 secrets are maps
# natively, and nowhere else. It is also exactly how every foundation reads the
# platform wildcard certificate, which has been a two-field object all along.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hello.fullname" . }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secret.storeName }}
    kind: SecretStore
  target:
    name: {{ include "hello.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        # "<tenant>-<name>" everywhere except AWS, where Secrets Manager names
        # are paths and the tenant's IAM policy grants "<env>/<tenant>/*".
        key: {{ include "hello.remoteKey" . | quote }}
{{- end }}
