apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello.fullname" . }}
  labels:
    {{- include "hello.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hello.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hello.labels" . | nindent 8 }}
    spec:
      # The app talks to nothing but its own filesystem: no API access, so no
      # token to steal out of it.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WELCOME_MESSAGE
              value: {{ .Values.welcomeMessage | quote }}
            - name: CLOUD
              value: {{ .Values.cloud | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: TEST_SECRET_NAME
              value: {{ .Values.secret.name | quote }}
            {{- if .Values.secret.enabled }}
            # A path, not the value: the volume below is refreshed in place by
            # the kubelet, so a secret that syncs (or rotates) after the pod
            # started is picked up without a restart. An env var taken from
            # secretKeyRef would be frozen at exec time.
            - name: TEST_SECRET_FILE
              value: /etc/onek8s/secret/{{ include "hello.secretKey" . }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            # The root filesystem is read-only, and the .NET runtime still
            # wants somewhere to put its diagnostics socket.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secret.enabled }}
            - name: test-secret
              mountPath: /etc/onek8s/secret
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.secret.enabled }}
        - name: test-secret
          secret:
            secretName: {{ include "hello.secretName" . }}
            # Optional, so the pod starts and renders "not available" while
            # External Secrets is still working — or when the secret simply
            # has not been created in this cloud's backend yet. Without it the
            # pod would sit in ContainerCreating with nothing to show for it.
            optional: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
