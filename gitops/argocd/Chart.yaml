apiVersion: v2
name: onek8s-argocd
description: >-
  Everything Argo CD runs, as Argo CD objects: the platform AppProject and the
  ApplicationSets that fan the platform's applications out to every cloud. The
  root Application that gitops/root-app.tf creates is the only piece of this
  that Terraform owns; from here down the delivery plane is Git.
