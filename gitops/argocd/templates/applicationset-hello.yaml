{{- if .Values.apps.hello.enabled }}
{{- $secret := .Values.apps.hello.secret }}
{{- /*
The tenant's test secret, spelled the way each backend spells it. This is the
only string on the platform that is not the same word on all four clouds, and
resolving it here is deliberate: Key Vault, Secret Manager and OCI Vault names
are flat because each environment has its own vault, project and compartment,
while Secrets Manager is account-wide, so the tenant's IAM role there is
restricted to "<environment>/<tenant>/*" (modules/tenant-namespace/aws/main.tf).

The application's chart is handed the finished key and never learns which
cloud it landed on — a developer's chart has no business branching on that.
*/}}
{{- $flatKey := printf "%s-%s" .Values.tenant $secret.name }}
{{- $pathKey := printf "%s/%s/%s" .Values.environment .Values.tenant $secret.name }}
# "Deploy the hello app to every cloud", as one object.
#
# Two generators, unioned, because the hub is not shaped like a spoke: the
# spokes are cluster Secrets that gitops/ writes and labels, and Argo CD's
# built-in entry for the cluster it runs on (in-cluster) has no Secret and
# therefore no labels to select on. So the spokes come from a cluster generator
# — which self-adjusts as var.spokes gains or loses a cloud — and AKS is one
# static list element.
#
# NOTE ON BRACES: Helm and Argo CD both use Go templates, and this file is
# rendered by both. Anything wrapped in a backtick-quoted Helm literal comes
# through untouched and is evaluated later by the ApplicationSet controller;
# everything else is substituted by Helm at sync time from values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello
  namespace: {{ .Values.argocdNamespace }}
  labels:
    app.kubernetes.io/part-of: onek8s
    onek8s.io/environment: {{ .Values.environment | quote }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Promote one immutable desired revision through the clouds in order. The
  # ApplicationSet controller starts a later step only after every Application
  # in the preceding step is Synced and Healthy. Hello's /readyz probe includes
  # its cloud-backed secret, so "Healthy" is the platform smoke test rather
  # than merely proof that the process started.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: onek8s.io/cloud
              operator: In
              values: [azure]
          maxUpdate: 1
        - matchExpressions:
            - key: onek8s.io/cloud
              operator: In
              values: [aws]
          maxUpdate: 1
        - matchExpressions:
            - key: onek8s.io/cloud
              operator: In
              values: [gcp]
          maxUpdate: 1
        - matchExpressions:
            - key: onek8s.io/cloud
              operator: In
              values: [oci]
          maxUpdate: 1

  generators:
    {{- if .Values.apps.hello.hub.enabled }}
    # The hub itself (AKS), which Argo CD addresses as "in-cluster".
    - list:
        elements:
          - values:
              cloud: {{ .Values.apps.hello.hub.cloud | quote }}
              cluster: {{ .Values.apps.hello.hub.cluster | quote }}
    {{- end }}
    # Every spoke registered for this environment. A cloud that is not in
    # var.spokes has no cluster Secret, so it simply produces no Application
    # here — nothing to keep in sync between the two.
    - clusters:
        selector:
          matchLabels:
            onek8s.io/environment: {{ .Values.environment | quote }}
        values:
          cloud: '{{`{{ index .metadata.labels "onek8s.io/cloud" }}`}}'
          cluster: '{{`{{ .name }}`}}'

  template:
    metadata:
      name: 'hello-{{`{{ .values.cloud }}`}}'
      labels:
        app.kubernetes.io/part-of: onek8s
        onek8s.io/cloud: '{{`{{ .values.cloud }}`}}'
        onek8s.io/environment: {{ .Values.environment | quote }}
    spec:
      project: {{ .Values.project.name }}
      source:
        repoURL: {{ .Values.repoURL | quote }}
        targetRevision: {{ .Values.targetRevision | quote }}
        path: {{ .Values.apps.hello.path | quote }}
        helm:
          # Parameters rather than a values block: they are plain strings, so
          # the per-cluster substitutions above are unambiguous, and they
          # override the chart's own values.yaml without duplicating it.
          parameters:
            - name: cloud
              value: '{{`{{ .values.cloud }}`}}'
            - name: environment
              value: {{ .Values.environment | quote }}
            - name: tenant
              value: {{ .Values.tenant | quote }}
            # One label deep, which is all the *.onek8s.lol wildcard covers.
            - name: ingress.host
              value: '{{`{{ .values.cloud }}`}}-{{ .Values.apps.hello.hostPrefix }}.{{ .Values.domain }}'
            - name: secret.name
              value: {{ $secret.name | quote }}
            # Resolved per cluster, from the two spellings computed above: a
            # path on Secrets Manager, a flat name everywhere else.
            - name: secret.remoteKey
              value: '{{`{{ if eq .values.cloud "aws" }}`}}{{ $pathKey }}{{`{{ else }}`}}{{ $flatKey }}{{`{{ end }}`}}'
            - name: welcomeMessage
              value: 'Welcome to OneK8s on {{`{{ .values.cloud }}`}} ({{ .Values.environment }})!'
      destination:
        # By name, not by server URL: the spokes' API endpoints are whatever
        # EKS, GKE and OKE happen to have handed out, and Argo CD already knows
        # them from the cluster Secret the gitops stack wrote.
        name: '{{`{{ .values.cluster }}`}}'
        namespace: {{ .Values.tenant | quote }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # The namespace belongs to the tenants stack. If it is missing, the
          # sync should fail loudly rather than have Argo CD create a namespace
          # with none of the tenant's quota, network policy or SecretStore.
          - CreateNamespace=false
      revisionHistoryLimit: 3
{{- end }}
